; QuadSpider - PlatformIO project
;
;   pio run -e esp32dev -t upload       build + flash the robot firmware
;   pio device monitor                  serial log + command console (115200)
;   pio test -e native                  logic tests on the PC (no hardware)
;   pio test -e esp32dev                hardware test firmware (test/hardware/*) on the ESP32
;   pio test -e esp32dev -f hardware/test_estop   one hardware suite

[platformio]
default_envs = esp32dev

[common]
build_flags =
  -std=gnu++17
  -Iconfig
  -Wall
  -Wextra

[env:esp32dev]
; Classic ESP32 (WROOM-32) is required: the PS5 controller uses Bluetooth Classic,
; which ESP32-S2/S3/C3 do not have.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; Bluetooth + WiFi need more than the default 1.2 MB app slot
board_build.embed_txtfiles = dashboard/index.html
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  quad_core
  quad_esp32
  quad_test_support   ; header-only fakes, only used by the hardware test firmware
  https://github.com/rodneybakiskan/ps5-esp32.git#42b9ca971876ee19fce35e30a6dfc4232e077e65
test_filter = hardware/*
test_speed = 115200

[env:native]
platform = native
build_flags =
  ${common.build_flags}
  -DQUAD_NATIVE
lib_deps =
  quad_core
  quad_test_support
test_filter = native/*
